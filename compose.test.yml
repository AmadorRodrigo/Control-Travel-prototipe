services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_DB: control_travel_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d control_travel_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  tests:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    environment:
      DATABASE_URL: postgresql+psycopg2://test:test-only-password@db:5432/control_travel_test
      SECRET_KEY: isolated-test-secret-with-at-least-32-characters
      TRUSTED_HOSTS: testserver,localhost
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
